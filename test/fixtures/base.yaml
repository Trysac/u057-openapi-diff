openapi: 3.0.3
info:
  title: Fixture API
  version: "1.0"
paths:
  /users:
    get:
      responses:
        "200":
          description: ok
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /status:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: string
                enum: [up]
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
